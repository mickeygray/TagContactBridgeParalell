# ─────────────────────────────────────────────────────────────────────────────
# Parallel — production reverse proxy config
# ─────────────────────────────────────────────────────────────────────────────
#
# Drop this `server { }` block into the running nginx's http {} (alongside
# the legacy block, OR replace the legacy block once retired). Not a
# standalone nginx.conf — the surrounding `worker_processes`, `events {}`,
# `http {}`, mime.types include, etc. live in the existing
# C:\tools\nginx-1.29.6\conf\nginx.conf.
#
# Pattern: same auth-subrequest gate as the legacy app. Public paths bypass
# the gate; everything else hits /auth-check first and 302s to /login on 401.
#
# Backend processes (see PARALLEL_PRODUCTION_DEPLOYMENT.md for the full map):
#   :3001  web-client (Vite dev OR static build server — same port either way)
#   :5001  control-plane
#   :4001  inbound-gateway
#   :4002  outbound-gateway
#   :6101  ringcentral-cx
#
# To use:
#   1. Append this server block to C:\tools\nginx-1.29.6\conf\nginx.conf
#   2. nginx -t  (validate)
#   3. nginx -s reload
#
# To test from the host:
#   curl -i http://localhost/api/auth/me           # 401 (expected — no token)
#   curl -i http://localhost/                      # SPA shell from web-client
#   curl -i http://localhost/api/recordings/play/X # passes through (HMAC-gated
#                                                  # at the app, not nginx)
# ─────────────────────────────────────────────────────────────────────────────

upstream parallel_web {
    server 127.0.0.1:5001;
    keepalive 16;
}

upstream parallel_cp {
    server 127.0.0.1:5001;
    keepalive 16;
}

upstream parallel_inbound {
    server 127.0.0.1:4001;
    keepalive 16;
}

upstream parallel_outbound {
    server 127.0.0.1:4002;
    keepalive 16;
}

upstream parallel_cx {
    server 127.0.0.1:6101;
    keepalive 16;
}

upstream parallel_ringcx_stream_probe {
    server 127.0.0.1:3336;
    keepalive 4;
}

server {
    listen 81;
    # When co-existing with the legacy nginx server block on :80, listen on a
    # different port and have ngrok forward to it. Once legacy retires, change
    # this to `listen 80;` and remove the legacy block.
    server_name localhost tagcontactbridge.ngrok.app tag-webhook.ngrok.app;

    # ngrok terminates HTTPS upstream and forwards plain HTTP to us on :81,
    # so $scheme is "http" inside this server. Any redirects nginx generates
    # would otherwise be http://host:81/path — broken for ngrok clients.
    # Strip the port + force-relative redirects so the client sees clean
    # paths it can resolve against the original https://tagcontactbridge.ngrok.app.
    absolute_redirect off;
    port_in_redirect off;

    # Generous body size — the NCOA upload streams a 30+ MB CSV.
    client_max_body_size 64m;

    # ── Auth subrequest ──────────────────────────────────────────────
    # Internal-only subrequest that hits the control-plane's
    # /api/auth/check endpoint. Used by `auth_request /auth-check`
    # directives below. Pass the original cookie + JWT-bearer header
    # through so the gate sees the same auth context the client sent.
    location = /auth-check {
        internal;
        proxy_pass http://parallel_cp/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location @login_redirect {
        return 302 /login;
    }

    # API-specific 401 handler. Instead of redirecting fetch() calls to
    # /login (which the SPA would silently follow and parse as JSON
    # garbage), return a clean 401 JSON. The SPA's API client checks
    # status === 401 and clears the session — that path works correctly
    # with this response.
    location @api_unauthorized {
        default_type application/json;
        return 401 '{"ok":false,"error":"Authentication required"}';
    }

    # Raw service health is for local/service checks, not the public tunnel.
    # Admin-facing runtime health stays behind /api/health/* and the normal
    # auth gate.
    location = /health {
        return 404;
    }

    # ── Public app shell + assets ────────────────────────────────────
    # The web-client serves the SPA + its assets. Whether it's Vite dev
    # server or a static build doesn't matter to nginx — same port.

    location = /login {
        proxy_pass http://parallel_web/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        # Vite HMR / WebSocket upgrade in dev mode.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Static asset paths shared by Vite + production build.
    location ~* ^/(static|assets|images|favicon\.ico|manifest\.json|asset-manifest\.json|logo[0-9]+\.png|robots\.txt|sitemap\.xml)/?$ {
        proxy_pass http://parallel_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ~* ^/(@vite|@react-refresh|node_modules|src)/ {
        # Vite-only paths — needed in dev. Harmless in prod (404s).
        proxy_pass http://parallel_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── Auth API (public — these ARE the login flow) ─────────────────
    location ~ ^/api/auth/(send-code|verify-code|logout)$ {
        proxy_pass http://parallel_cp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    # ── RC OAuth callback (public — RC redirects here with ?code=&state=) ─
    # Browser-driven redirect from RingCentral consent screen. The user's
    # browser doesn't carry a Parallel JWT on this navigation (it's an
    # external OAuth round-trip), so this MUST bypass the auth_request
    # gate. Security: the callback validates `state` against a server-
    # side row (single-use, TTL'd) and uses PKCE — it cannot be abused
    # without the matching code_verifier on our side.
    # Public runtime heartbeat used by the SPA to notice server restarts.
    # It exposes only service/runtime metadata, not user data, and needs to
    # work before the user has an auth token.
    location = /api/client/runtime {
        proxy_pass http://parallel_cp/api/client/runtime;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Temporary RingCX Call Streaming WSS receiver probe. Public because
    # RingCX is the client; the probe itself only logs metadata/audio bytes.
    location = /ringcx-stream {
        proxy_pass http://parallel_ringcx_stream_probe/ringcx-stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
    }

    location = /api/auth/cx/callback {
        proxy_pass http://parallel_cp/api/auth/cx/callback;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Sales trainer API (trainer OTP/allowlist-gated at the app).
    # Sales trainer is protected by its own OTP/allowlist middleware
    # under /api/sales-trainer. Do not put it behind the main app
    # auth_request gate, or allowlisted trainer-only users would be
    # unable to request/verify their trainer OTP. Multipart mic clips
    # for Whisper also need the larger body cap.
    location /api/sales-trainer/ {
        proxy_pass http://parallel_cp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_request_buffering off;
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
        client_max_body_size 32m;
    }

    # Recording playback proxy (public; HMAC-gated at the app).
    # The Apps Script player mints short-lived signed URLs that include
    # the HMAC. Cookie auth is unnecessary and would break the workflow
    # because the Apps Script viewer does not have a Parallel cookie.
    location ~ ^/api/recordings/play/ {
        proxy_pass http://parallel_cp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        # Stream-friendly: turn off buffering + raise read timeouts so
        # range-request audio playback doesn't get chopped.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Public webhook endpoints ─────────────────────────────────────
    # Receivers from third parties (CallRail, RingCentral, etc.) — these
    # have their own signature verification at the app layer. nginx just
    # routes; no auth gate.
    location /api/inbound/ {
        proxy_pass http://parallel_cp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_request_buffering off;
    }

    location = /fb/webhook {
        proxy_pass http://parallel_cp/fb/webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_request_buffering off;
    }

    location = /tt/webhook {
        proxy_pass http://parallel_cp/tt/webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_request_buffering off;
    }

    location = /lead-contact {
        proxy_pass http://parallel_cp/lead-contact;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_request_buffering off;
    }

    location = /lead-contact/pre-ping {
        proxy_pass http://parallel_cp/lead-contact/pre-ping;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_request_buffering off;
    }

    location = /test-lead {
        proxy_pass http://parallel_cp/test-lead;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_request_buffering off;
    }

    location /webhook/inbound/ {
        proxy_pass http://parallel_inbound;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Some webhook providers POST raw bodies that the app needs verbatim
        # for signature verification — disable request buffering so the
        # body hits the app exactly as sent.
        proxy_request_buffering off;
    }

    location /webhook/outbound/ {
        proxy_pass http://parallel_outbound;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
    }

    location /webhook/cx/ {
        proxy_pass http://parallel_cx;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
    }

    # RingCX Workflow Studio probe lane is disabled by default. Re-enable
    # the proxy_pass only during an active audio-streaming test window.
    location /ringcx/ {
        return 410;
    }

    # CallRail SMS inbound webhook. Lives on control-plane (5001) —
    # the route handler does HARD_STOP keyword detection and per-
    # channel DNC marking via `leadCadenceRepository.markChannelDnc`.
    # Routed here as an explicit location (rather than under a
    # /webhook/ prefix) because CallRail's webhook URL config is
    # historically `/sms/inbound` — keeping the path stable means the
    # CallRail-side change at cutover is a host change only, not a
    # path change. If we ever consolidate webhook paths under
    # /webhook/sms/, mirror this location to that prefix and run
    # both for a transition window.
    location = /sms/inbound {
        proxy_pass http://parallel_cp/sms/inbound;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Raw-body delivery so the app-layer signature verification
        # (when added — see "edge hardening" backlog) sees bytes as
        # CallRail signed them.
        proxy_request_buffering off;
    }

    # ── Auth-gated API ───────────────────────────────────────────────
    # Catches everything under /api/ that isn't auth or recordings.
    location /api/ {
        auth_request /auth-check;
        # API requests get a JSON 401 (so the SPA's fetch() handler can
        # process it cleanly + clear the session). Page-route 401s
        # below still redirect to /login.
        error_page 401 = @api_unauthorized;

        proxy_pass http://parallel_cp;
        proxy_http_version 1.1;
        # Clear the Connection header so upstream keepalive (parallel_cp
        # `keepalive 16;`) can pool sockets to control-plane.
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Authorization $http_authorization;

        # Stream-friendly: don't buffer upstream responses so SSE / live-coach
        # event streams flush to the client immediately, matching the
        # recording-playback and sales-trainer blocks above.
        proxy_buffering off;

        # NCOA / long-running uploads — bumped per the cleaning workspace's
        # ~2-hour worst-case window. Matches the per-route timeout we set
        # in apps/control-plane/src/routes/lexis.js.
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
        client_max_body_size 64m;
    }

    # ── CX-specific surfaces (when wired) ────────────────────────────
    # Currently no /cx/ public route on the Parallel side — CX queue routes
    # are under /api/ringcentral/cx-* and covered by the /api/ rule above.
    # Reserve this slot for direct CX UI hand-off if we add one later.

    # ── App shell catch-all ──────────────────────────────────────────
    # Anything not matched above falls through to the web-client SPA.
    # The SPA's React Router handles client-side routing for /dashboard,
    # /metrics, /cx, etc. We don't auth-gate at nginx for these routes
    # because the SPA itself checks auth via /api/auth/me on mount and
    # redirects to /login when needed — gating here would just produce a
    # double-redirect.
    location / {
        proxy_pass http://parallel_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        # Vite dev needs WebSocket upgrade for HMR. Harmless in prod.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
